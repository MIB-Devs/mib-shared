name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install .[dev]
      - name: Lint
        run: ruff check .

      - name: No outbound call without a timeout (FR-BE-21)
        # The library ships this check for every service to run; it has to hold
        # for the library itself first.
        run: mib-check-timeouts src tests
      - name: Test
        run: pytest -q
