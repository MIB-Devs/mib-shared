[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mib-shared"
version = "0.3.0"
description = "MIB cross-cutting mechanics: auth, error envelope, telemetry and tracing, readiness probes, traced HTTP client. No domain logic."
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.2",
    "fastapi>=0.111",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",
    "structlog>=24.1",
    "pydantic>=2.7",
]

[project.optional-dependencies]
# Only the four services that own a schema need these, and they already declare
# them. Kept as an extra rather than a hard dependency so the three services with
# no migrations do not inherit SQLAlchemy and Alembic; `mib_shared/__init__.py`
# deliberately does not import `mib_shared.migrations`.
migrations = ["sqlalchemy>=2.0", "alembic>=1.13"]
dev = ["pytest>=8.0", "ruff>=0.5", "sqlalchemy>=2.0", "alembic>=1.13"]

[project.scripts]
# Every service's CI runs this over its own source: an outbound call without a
# timeout fails the build rather than being caught in review (FR-BE-21).
mib-check-timeouts = "mib_shared.lint:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mib_shared*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Pinned explicitly so a newer ruff release cannot silently change what CI
# enforces. Add rules deliberately, not by upgrading the tool.
select = ["E", "F", "I", "B", "UP"]
